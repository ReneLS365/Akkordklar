name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node --test
      - run: npm test
      - run: npm run build:bridge
      - run: git diff --exit-code -- dist/native-bridge.mjs
      - run: git diff --check
